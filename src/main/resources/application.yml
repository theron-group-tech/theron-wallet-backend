server:
  port: 8080

spring:
  application:
    name: theron-wallet-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:theron_wallet}
    username: ${DB_USERNAME:theron}
    password: ${DB_PASSWORD:theron}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Asaas API Configuration
asaas:
  api:
    base-url: ${ASAAS_API_BASE_URL:https://api-sandbox.asaas.com/v3}
    key: ${ASAAS_API_KEY}
    webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
    webhook-url: ${ASAAS_WEBHOOK_URL:}
    master-wallet-id: ${ASAAS_MASTER_WALLET_ID:}
    subaccount-defaults:
      mobile: ${ASAAS_SUBACCOUNT_DEFAULT_MOBILE:11999999999}
      postal-code: ${ASAAS_SUBACCOUNT_DEFAULT_POSTAL_CODE:01310100}
      address: ${ASAAS_SUBACCOUNT_DEFAULT_ADDRESS:Avenida Paulista}
      address-number: ${ASAAS_SUBACCOUNT_DEFAULT_ADDRESS_NUMBER:1000}
      province: ${ASAAS_SUBACCOUNT_DEFAULT_PROVINCE:Bela Vista}
      income-value: ${ASAAS_SUBACCOUNT_DEFAULT_INCOME_VALUE:10000}
      company-type: ${ASAAS_SUBACCOUNT_DEFAULT_COMPANY_TYPE:LIMITED}
      birth-date: ${ASAAS_SUBACCOUNT_DEFAULT_BIRTH_DATE:1990-01-01}
    timeout:
      connect: 5000
      read: 10000
    retry:
      max-attempts: 3

# Encryption (AES-256-GCM for API key storage)
encryption:
  aes-key: ${ENCRYPTION_AES_KEY}

# Actuator / Health
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

# Default admin seed (first-boot only; no hardcoded password)
app:
  admin:
    email: ${APP_ADMIN_EMAIL:${DEFAULT_ADMIN_EMAIL:}}
    password: ${APP_ADMIN_PASSWORD:${DEFAULT_ADMIN_PASSWORD:}}

platform:
  split:
    percent: ${PLATFORM_SPLIT_PERCENT:0}
    fixed-amount: ${PLATFORM_SPLIT_FIXED_AMOUNT:0}
    enabled: ${PLATFORM_SPLIT_ENABLED:true}

# Logging
logging:
  level:
    root: INFO
    com.theron.wallet: DEBUG
    org.springframework.web.reactive.function.client: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
